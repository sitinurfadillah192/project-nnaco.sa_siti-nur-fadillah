name: NNACOSA CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Automated Unit Testing & Code Verification
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: nnaco_sa
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, curl, mbstring, openssl, json
          coverage: none

      - name: ⚙️ Setup Environment Configuration
        run: |
          cp .env.example .env
          echo "Environment configuration successfully initialized from .env.example"

      - name: 🗄️ Import Database Schema & Seed Data
        run: |
          mysql -h 127.0.0.1 -u root nnaco_sa < database/nnaco_sa.sql
          echo "Database schema successfully imported."

      - name: 🔍 Verify Database Connection & Tables
        run: |
          mysql -h 127.0.0.1 -u root -e "USE nnaco_sa; SHOW TABLES;"

      - name: 🚀 Run CI/CD Automated Test Suite
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASS: ""
          DB_NAME: nnaco_sa
          APP_ENV: testing
        run: |
          php tests/run_tests.php
